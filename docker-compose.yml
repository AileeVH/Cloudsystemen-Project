services:
  stepapp-users:
    build: .
    container_name: stepapp-users
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - stepapp-users

volumes:
  caddy_data:
  caddy_config: